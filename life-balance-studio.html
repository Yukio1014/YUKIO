<title>LIFE BALANCE STUDIO</title>
<style>/* ===== Life Balance Studio · iOS 浅色原生风格 ===== */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card-2:#FBFBFD;
  --separator:#E5E5EA;
  --label:#1C1C1E;
  --label-2:#3C3C43;
  --label-3:#8E8E93;
  --label-4:#C7C7CC;
  --blue:#007AFF;
  --blue-tap:#0051D5;
  --green:#34C759;
  --red:#FF3B30;
  --orange:#FF9500;
  --yellow:#FFCC00;
  --purple:#AF52DE;
  --radius:14px;
  --radius-lg:22px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--label);
  font-size:17px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,textarea{font-family:inherit;}

/* ===== 主容器 ===== */
#app{display:flex;height:100%;width:100%;position:relative;overflow:hidden;}

/* ===== 侧边栏 ===== */
.sidebar{
  position:absolute;top:0;left:0;bottom:0;width:280px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.32,.72,0,1);
  z-index:100;display:flex;flex-direction:column;
  border-right:.5px solid var(--separator);
}
.sidebar.open{transform:translateX(0);}
.sidebar-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:99;
}
.sidebar-overlay.show{opacity:1;pointer-events:auto;}
.sidebar-header{padding:60px 20px 24px;}
.sidebar-avatar{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#007AFF,#5AC8FA);
  color:#fff;font-weight:600;font-size:22px;
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;
}
.sidebar-title{font-size:20px;font-weight:600;}
.sidebar-subtitle{font-size:13px;color:var(--label-3);margin-top:2px;}
.sidebar-nav{flex:1;padding:8px 12px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 14px;border-radius:12px;
  font-size:16px;font-weight:500;color:var(--label-2);
  transition:background .15s ease,transform .1s ease;
}
.nav-item:active{background:var(--bg);transform:scale(.98);}
.nav-item.active{background:var(--blue);color:#fff;}
.nav-item.active .nav-icon{filter:none;}
.nav-icon{font-size:20px;width:24px;text-align:center;}
.sidebar-footer{padding:16px 20px;font-size:12px;color:var(--label-4);text-align:center;}

/* ===== 主区域 ===== */
.main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg);}
.topbar{
  height:44px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
  background:rgba(242,242,247,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:.5px solid transparent;
  position:relative;z-index:10;
}
.topbar.scrolled{border-bottom-color:var(--separator);}
.topbar-btn{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--blue);transition:background .15s,transform .1s;
}
.topbar-btn:active{background:rgba(0,0,0,.06);transform:scale(.92);}
.topbar-title{font-size:17px;font-weight:600;text-align:center;flex:1;}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 120px;}
.content::-webkit-scrollbar{width:0;}

/* ===== 底部悬浮操作栏 ===== */
.fab-bar{
  position:absolute;left:0;right:0;bottom:0;
  padding:10px 16px calc(10px + var(--safe-bottom));
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--separator);
  display:flex;gap:10px;z-index:20;
  transform:translateY(0);transition:transform .25s ease;
}
.fab-bar.hidden{transform:translateY(120%);}
.fab-btn{
  flex:1;height:50px;border-radius:14px;
  font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s,opacity .15s;
}
.fab-btn:active{transform:scale(.96);}
.fab-expense{background:#FFF1F0;color:var(--red);}
.fab-checkin{background:#F0FFF4;color:var(--green);}

/* ===== 通用卡片 ===== */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  padding:18px;margin-bottom:12px;
}
.card-title{font-size:13px;color:var(--label-3);font-weight:500;margin-bottom:10px;}
.section-title{
  font-size:22px;font-weight:700;padding:20px 4px 12px;
  letter-spacing:-.3px;
}

/* ===== 首页 ===== */
.home-header{padding:8px 4px 4px;font-size:13px;color:var(--label-3);}

/* 财务核心卡 */
.money-hero{
  background:var(--card);border-radius:var(--radius-lg);
  padding:24px 20px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.money-hero::before{
  content:"";position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,122,255,.06),transparent 70%);
}
.money-hero-label{font-size:13px;color:var(--label-3);font-weight:500;}
.money-hero-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px;}
.money-hero-saved{font-size:34px;font-weight:700;letter-spacing:-1px;}
.money-hero-saved .currency{font-size:20px;font-weight:600;margin-right:2px;}
.money-hero-target{font-size:13px;color:var(--label-3);margin-top:4px;}
.ring-wrap{width:96px;height:96px;position:relative;flex-shrink:0;}
.ring-bg{stroke:#EEF0F4;stroke-width:10;fill:none;}
.ring-fg{stroke:var(--blue);stroke-width:10;fill:none;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;
  transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:var(--blue);}

.diff-block{
  margin-top:18px;padding-top:16px;border-top:.5px solid var(--separator);
  display:flex;align-items:baseline;gap:8px;
}
.diff-label{font-size:14px;color:var(--label-3);}
.diff-value{font-size:36px;font-weight:800;color:var(--blue);letter-spacing:-1px;}
.diff-value .currency{font-size:22px;margin-right:2px;}
.diff-tail{font-size:13px;color:var(--label-3);margin-left:auto;}

/* 学习速览卡 */
.study-card{display:flex;flex-direction:column;gap:10px;}
.study-card-top{display:flex;align-items:center;justify-content:space-between;}
.study-count{font-size:20px;font-weight:600;}
.study-count .num{color:var(--orange);font-size:24px;}
.study-progress{height:6px;background:#EEF0F4;border-radius:3px;overflow:hidden;}
.study-progress span{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .5s ease;}
.study-progress-label{font-size:12px;color:var(--label-3);display:flex;justify-content:space-between;}
.go-checkin{
  align-self:flex-end;background:var(--blue-tap);color:#fff;
  padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;
  transition:transform .1s;
}
.go-checkin:active{transform:scale(.94);}

/* 快捷入口 */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.quick-item{
  background:var(--card);border-radius:var(--radius);padding:16px 10px;
  text-align:center;transition:transform .1s;
}
.quick-item:active{transform:scale(.96);background:var(--card-2);}
.quick-icon{font-size:28px;margin-bottom:6px;}
.quick-label{font-size:12px;color:var(--label-2);}

/* ===== 财务板块 ===== */
.month-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px;
}
.month-nav-btn{
  width:36px;height:36px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-size:18px;box-shadow:var(--shadow-card);
  transition:transform .1s;
}
.month-nav-btn:active{transform:scale(.9);}
.month-title{font-size:18px;font-weight:700;}

.io-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:.5px solid var(--separator);
}
.io-row:last-child{border-bottom:none;}
.io-row-label{font-size:16px;}
.io-row-value{font-size:16px;font-weight:600;}
.io-row-value.income{color:var(--green);}
.io-row-value.expense{color:var(--red);}

.summary-card{
  background:linear-gradient(135deg,#007AFF,#5AC8FA);
  color:#fff;border-radius:var(--radius-lg);padding:20px;margin:12px 0;
  box-shadow:0 4px 16px rgba(0,122,255,.25);
}
.summary-row{display:flex;justify-content:space-between;margin-bottom:6px;}
.summary-row:last-child{margin-bottom:0;}
.summary-label{opacity:.85;font-size:14px;}
.summary-value{font-weight:600;font-size:16px;}
.summary-total{font-size:28px;font-weight:800;}

.cat-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:12px;font-size:13px;
  background:#F0F0F5;margin:4px 4px 0 0;
}

.report-btn{
  width:100%;padding:14px;border-radius:14px;
  background:var(--card);color:var(--blue);
  font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--shadow-card);transition:transform .1s;
}
.report-btn:active{transform:scale(.98);}

/* 偏差报告 */
.bar-row{margin-bottom:14px;}
.bar-row-label{font-size:14px;font-weight:600;margin-bottom:6px;}
.bar-pair{display:flex;gap:8px;}
.bar-col{flex:1;}
.bar-col-tag{font-size:11px;color:var(--label-3);margin-bottom:3px;}
.bar{height:22px;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.bar.planned{background:#D1D1D6;}
.bar.actual{background:var(--blue);}
.bar.actual.over{background:var(--red);}
.bar.actual.under{background:var(--green);}
.bar-val{font-size:12px;color:var(--label-3);margin-top:3px;}
.report-summary{
  background:#F0F5FF;border-radius:12px;padding:14px 16px;
  font-size:14px;line-height:1.5;color:var(--label-2);
}

/* ===== 学习板块 ===== */
.week-cal{display:flex;gap:6px;margin-bottom:16px;}
.week-day{
  flex:1;background:var(--card);border-radius:12px;padding:10px 4px;
  text-align:center;transition:transform .1s;
}
.week-day:active{transform:scale(.94);}
.week-day.today{background:var(--blue);color:#fff;}
.week-day.done{background:#F0FFF4;}
.week-day-name{font-size:11px;opacity:.7;}
.week-day-num{font-size:18px;font-weight:700;margin-top:2px;}
.week-day-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin:4px auto 0;}
.week-day.today .week-day-dot{background:#fff;}

.task-card{
  background:var(--card);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-card);transition:opacity .2s;
}
.task-circle{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--blue);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;position:relative;
}
.task-circle.done{background:var(--green);border-color:var(--green);}
.task-circle svg{opacity:0;transition:opacity .15s;}
.task-circle.done svg{opacity:1;}
.task-text{flex:1;font-size:16px;}
.task-text.done{color:var(--label-3);text-decoration:line-through;}
.task-meta{font-size:12px;color:var(--label-3);margin-top:2px;}

.inspire-input{
  width:100%;border:none;border-bottom:1px solid var(--separator);
  padding:12px 4px;font-size:16px;background:transparent;
  transition:border-color .2s;
}
.inspire-input:focus{outline:none;border-bottom-color:var(--blue);}
.inspire-list{margin-top:12px;}
.inspire-item{
  padding:10px 4px;border-bottom:.5px solid var(--separator);
  font-size:15px;color:var(--label-2);
}

/* 粒子特效 */
.particle{
  position:fixed;width:8px;height:8px;border-radius:50%;
  pointer-events:none;z-index:999;
}

/* ===== 家庭板块 ===== */
.avatar-wall{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.avatar-card{
  background:var(--card);border-radius:var(--radius-lg);
  padding:20px;text-align:center;box-shadow:var(--shadow-card);
  perspective:800px;cursor:pointer;
}
.avatar-circle{
  width:72px;height:72px;border-radius:50%;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;font-weight:600;
}
.avatar-name{font-size:17px;font-weight:600;}
.avatar-role{font-size:13px;color:var(--label-3);margin-top:2px;}
.avatar-back{
  text-align:left;font-size:14px;color:var(--label-2);
}
.avatar-back-row{margin-bottom:8px;}
.avatar-back-label{font-size:12px;color:var(--label-3);}
.bday-badge{
  display:inline-block;background:#FFEBEB;color:var(--red);
  padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;
  margin-top:6px;
}

/* ===== 健康板块 ===== */
.search-bar{
  position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;
}
.search-input-wrap{
  background:rgba(118,118,128,.12);border-radius:10px;
  padding:8px 12px;display:flex;align-items:center;gap:8px;
}
.search-input{flex:1;border:none;background:transparent;font-size:16px;}
.search-input:focus{outline:none;}

.health-folder{
  background:var(--card);border-radius:var(--radius);margin-bottom:10px;
  overflow:hidden;box-shadow:var(--shadow-card);
}
.health-folder-head{
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  font-size:16px;font-weight:600;
}
.health-folder-arrow{margin-left:auto;color:var(--label-3);transition:transform .2s;}
.health-folder.open .health-folder-arrow{transform:rotate(90deg);}
.health-folder-body{display:none;padding:0 16px 12px;}
.health-folder.open .health-folder-body{display:block;}
.health-file{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-top:.5px solid var(--separator);
}
.health-file-icon{width:36px;height:36px;border-radius:8px;background:#F0F0F5;
  display:flex;align-items:center;justify-content:center;font-size:18px;}
.health-file-info{flex:1;}
.health-file-name{font-size:15px;font-weight:500;}
.health-file-tag{font-size:12px;color:var(--label-3);margin-top:2px;}
.health-file-check{color:var(--green);font-size:16px;}

/* ===== 朋友圈板块 ===== */
.social-scroll{
  display:flex;gap:14px;overflow-x:auto;padding:4px 4px 20px;
  -webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;
}
.social-scroll::-webkit-scrollbar{height:0;}
.social-card{
  flex:0 0 260px;background:var(--card);border-radius:var(--radius-lg);
  padding:20px;box-shadow:var(--shadow-card);scroll-snap-align:start;
}
.social-avatar{
  width:60px;height:60px;border-radius:50%;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;font-weight:600;
}
.social-name{font-size:18px;font-weight:700;}
.social-meta{font-size:13px;color:var(--label-3);margin-top:2px;}
.social-field{margin-top:12px;}
.social-field-label{font-size:12px;color:var(--label-3);}
.social-field-val{font-size:14px;margin-top:2px;}
.tag-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.tag-pill{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:500;color:#fff;}

.voice-btn{
  width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ===== 底部抽屉 ===== */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:200;
}
.sheet-overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + var(--safe-bottom));
  transform:translateY(100%);
  transition:transform .25s cubic-bezier(.32,.72,0,1);
  z-index:201;max-height:85vh;overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.12);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{
  width:36px;height:5px;background:var(--label-4);border-radius:3px;
  margin:6px auto 14px;
}
.sheet-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:16px;}
.sheet-content{padding-bottom:10px;}

.sheet-field{margin-bottom:14px;}
.sheet-label{font-size:14px;color:var(--label-3);margin-bottom:6px;}
.sheet-input{
  width:100%;border:1px solid var(--separator);border-radius:10px;
  padding:12px 14px;font-size:16px;background:var(--card-2);
  transition:border-color .2s;
}
.sheet-input:focus{outline:none;border-color:var(--blue);}
.sheet-textarea{min-height:80px;resize:none;}

.cat-select{display:flex;flex-wrap:wrap;gap:8px;}
.cat-opt{
  padding:8px 14px;border-radius:18px;background:var(--bg);
  font-size:14px;transition:all .15s;
}
.cat-opt.selected{background:var(--blue);color:#fff;}

.sheet-actions{display:flex;gap:10px;margin-top:18px;}
.sheet-btn{
  flex:1;height:50px;border-radius:14px;font-size:16px;font-weight:600;
  transition:transform .1s;
}
.sheet-btn:active{transform:scale(.97);}
.sheet-btn-primary{background:var(--blue);color:#fff;}
.sheet-btn-secondary{background:var(--bg);color:var(--label-2);}

/* 数字键盘 */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.numpad-key{
  height:56px;border-radius:12px;background:var(--bg);
  font-size:22px;font-weight:500;transition:transform .08s,background .15s;
}
.numpad-key:active{transform:scale(.94);background:#E5E5EA;}
.numpad-display{
  font-size:36px;font-weight:700;text-align:center;padding:16px 0;
  letter-spacing:-1px;min-height:60px;
}

/* ===== 空状态 ===== */
.empty-state{text-align:center;padding:48px 20px;color:var(--label-3);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:15px;}

/* ===== 动画 ===== */
@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:slideUp .25s ease;}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;
  border-radius:20px;font-size:14px;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1;}

/* ===== 事缓则圆板块 ===== */
/* Tab 切换 */
.dec-tabs{
  display:flex;background:rgba(118,118,128,.12);border-radius:10px;
  padding:2px;margin:4px 0 16px;
}
.dec-tab{
  flex:1;padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--label-3);text-align:center;transition:all .2s;
}
.dec-tab.active{background:var(--card);color:var(--label);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.dec-tab .tab-badge{
  display:inline-block;margin-left:3px;min-width:18px;padding:0 5px;
  border-radius:9px;font-size:11px;background:var(--label-4);color:#fff;line-height:14px;
}
.dec-tab.active .tab-badge{background:var(--blue);}

/* 悬案卡 */
.dec-card{
  background:var(--card);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;box-shadow:var(--shadow-card);
  transition:transform .1s;
}
.dec-card:active{transform:scale(.99);}
.dec-card.dead{background:#F4F4F6;opacity:.75;}
.dec-card.dead .dec-title,.dec-card.dead .dec-sub{text-decoration:line-through;color:var(--label-3);}
.dec-card.dead .dec-opt-name{text-decoration:line-through;}

.dec-row{display:flex;align-items:center;gap:12px;}
.dec-circle-out{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--blue);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.dec-circle-out.done{background:var(--green);border-color:var(--green);}
.dec-circle-out.done svg{opacity:1;}
.dec-circle-out svg{opacity:0;}
.dec-body{flex:1;min-width:0;}
.dec-title{font-size:16px;font-weight:500;}
.dec-sub{font-size:12px;color:var(--label-3);margin-top:3px;}

.dec-badge{
  display:inline-block;padding:2px 8px;border-radius:8px;
  font-size:11px;font-weight:600;margin-right:6px;
}
.dec-badge.cooling{background:#FFF3E0;color:var(--orange);}
.dec-badge.todo{background:#FFF8E1;color:#B8860B;}
.dec-badge.done{background:#E8F5E9;color:var(--green);}
.dec-badge.dead{background:#FFEBEE;color:var(--red);}

.dec-countdown{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;color:var(--orange);font-weight:600;
  margin-top:4px;
}
.dec-countdown.critical{color:var(--red);}
.dec-cool-bar{
  height:3px;background:#F0F0F5;border-radius:2px;margin-top:6px;overflow:hidden;
}
.dec-cool-bar span{display:block;height:100%;background:var(--orange);border-radius:2px;transition:width .4s;}

.dec-actions{display:flex;gap:8px;margin-top:12px;}
.dec-btn{
  flex:1;height:38px;border-radius:10px;font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:transform .1s;
}
.dec-btn:active{transform:scale(.96);}
.dec-btn-exec{background:#E8F5E9;color:var(--green);}
.dec-btn-drop{background:#FFEBEE;color:var(--red);}
.dec-btn-done{background:#E8F5E9;color:var(--green);}
.dec-btn-kill{background:#FFEBEE;color:var(--red);}
.dec-btn-ghost{background:var(--bg);color:var(--label-2);}

/* 比选折叠卡 */
.cmp-card{
  background:var(--card);border-radius:var(--radius);
  margin-bottom:10px;box-shadow:var(--shadow-card);overflow:hidden;
}
.cmp-head{
  padding:14px 16px;display:flex;align-items:center;gap:10px;
}
.cmp-icon{font-size:18px;}
.cmp-title{flex:1;font-size:16px;font-weight:600;}
.cmp-count{
  font-size:12px;color:var(--label-3);background:var(--bg);
  padding:2px 8px;border-radius:8px;
}
.cmp-arrow{color:var(--label-3);transition:transform .2s;}
.cmp-card.open .cmp-arrow{transform:rotate(90deg);}
.cmp-body{display:none;padding:0 16px 14px;}
.cmp-card.open .cmp-body{display:block;}

.cmp-opt{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-top:.5px solid var(--separator);
}
.cmp-opt-info{flex:1;min-width:0;}
.cmp-opt-name{font-size:15px;font-weight:500;}
.cmp-opt-meta{font-size:12px;color:var(--label-3);margin-top:2px;}
.cmp-opt-price{font-size:15px;font-weight:600;color:var(--orange);}
.cmp-opt-actions{display:flex;gap:6px;}
.cmp-opt-btn{
  padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;
  transition:transform .1s;
}
.cmp-opt-btn:active{transform:scale(.92);}
.cmp-opt-win{background:#E8F5E9;color:var(--green);}
.cmp-opt-kill{background:#FFEBEE;color:var(--red);}

.cmp-empty-opt{
  padding:14px 0;text-align:center;font-size:14px;color:var(--label-3);
  border-top:.5px dashed var(--separator);
}

/* 比选录入 */
.cmp-add-row{display:flex;gap:8px;margin-top:8px;}
.cmp-add-row input{flex:1;}
.cmp-add-btn{
  width:44px;height:44px;border-radius:10px;background:var(--blue);color:#fff;
  font-size:22px;flex-shrink:0;transition:transform .1s;
}
.cmp-add-btn:active{transform:scale(.92);}

/* 已选赢家标记 */
.cmp-winner-tag{
  display:inline-block;background:var(--green);color:#fff;
  padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-right:6px;
}

/* 死刑末尾标记 */
.dead-mark{font-size:13px;color:var(--red);margin-top:8px;font-weight:600;}

/* 开关 */
.toggle{
  position:relative;width:44px;height:26px;
  background:var(--label-4);border-radius:13px;cursor:pointer;
  transition:background .2s;flex-shrink:0;
}
.toggle.on{background:var(--green);}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;
  width:22px;height:22px;background:#fff;border-radius:50%;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after{transform:translateX(18px);}

/* 首页拆分卡 */
.split-card{
  background:var(--card);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card);
}
.split-row{display:flex;gap:10px;}
.split-cell{
  flex:1;text-align:center;padding:10px;border-radius:12px;
}
.split-cell.cool{background:#FFF3E0;}
.split-cell.todo{background:#FFF8E1;}
.split-cell-num{font-size:28px;font-weight:800;letter-spacing:-1px;}
.split-cell.cool .split-cell-num{color:var(--orange);}
.split-cell.todo .split-cell-num{color:#B8860B;}
.split-cell-label{font-size:12px;color:var(--label-3);margin-top:2px;}
.split-cell-sub{font-size:11px;color:var(--label-3);margin-top:6px;}

/* 历史存档分组标题 */
.arch-group{font-size:13px;color:var(--label-3);font-weight:600;padding:12px 4px 6px;}

/* 编辑按钮 */
.edit-btn{
  font-size:13px;font-weight:600;color:var(--blue);
  padding:4px 12px;border-radius:8px;background:rgba(0,122,255,.1);
  transition:transform .1s,background .15s;
}
.edit-btn:active{transform:scale(.92);background:rgba(0,122,255,.2);}

/* 月度消费双列对比 */
.cmp-pair-head{
  display:flex;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--separator);margin-bottom:4px;
  font-size:12px;color:var(--label-3);font-weight:600;
}
.cmp-pair-head .cmp-pair-name{flex:1;text-align:left;}
.cmp-pair-head .cmp-pair-col{width:80px;text-align:right;}
.cmp-pair-row{
  display:flex;align-items:center;padding:12px 0;
  border-bottom:.5px solid var(--separator);
}
.cmp-pair-row:last-child{border-bottom:none;}
.cmp-pair-row.total-row{font-weight:700;border-top:1px solid var(--separator);margin-top:4px;padding-top:12px;}
.cmp-pair-name{flex:1;font-size:15px;}
.cmp-pair-col{width:80px;text-align:right;font-size:15px;}
.cmp-pair-col.expense{color:var(--red);font-weight:600;}
.cmp-pair-edit{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--blue);font-size:14px;transition:background .15s;
}
.cmp-pair-edit:active{background:var(--bg);}
.cmp-pair-empty{text-align:center;padding:20px;color:var(--label-3);font-size:14px;}

/* ===== 年度存档 ===== */
.year-archive{padding:16px;margin-bottom:12px;}
.archive-section{padding:12px 0;border-bottom:1px solid var(--bg);}
.archive-section:last-child{border-bottom:none;}
.archive-section-title{font-size:16px;font-weight:600;margin-bottom:10px;}
.archive-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.archive-stat{background:var(--bg);border-radius:10px;padding:10px 12px;}
.archive-stat-label{font-size:12px;color:var(--label-3);margin-bottom:4px;}
.archive-stat-val{font-size:18px;font-weight:700;}
.archive-highlight{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFF8E1,#FFECB3);border-radius:12px;padding:12px;margin-bottom:12px;}
.archive-highlight.warn{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);}
.archive-sub-title{font-size:14px;font-weight:600;color:var(--label-2);margin:10px 0 6px;}
.archive-month-bars{display:flex;flex-direction:column;gap:6px;}
.archive-month-bar{display:flex;align-items:center;gap:8px;}
.archive-month-label{font-size:12px;color:var(--label-3);width:36px;flex-shrink:0;}
.archive-bar-pair{flex:1;display:flex;flex-direction:column;gap:2px;}
.archive-bar{height:18px;border-radius:4px;display:flex;align-items:center;padding:0 6px;min-width:40px;transition:width .3s;}
.archive-bar-plan{background:#E3F2FD;color:#1565C0;}
.archive-bar-actual{background:#BBDEFB;color:#0D47A1;font-weight:600;}
.archive-bar-text{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.archive-cat-list{display:flex;flex-direction:column;gap:5px;}
.archive-cat-row{display:flex;align-items:center;gap:8px;}
.archive-cat-name{font-size:13px;width:70px;flex-shrink:0;color:var(--label-2);}
.archive-cat-bar-wrap{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden;}
.archive-cat-bar{height:100%;background:var(--blue);border-radius:4px;transition:width .3s;}
.archive-cat-amount{font-size:11px;color:var(--label-3);width:110px;text-align:right;flex-shrink:0;}
.archive-plan-section{background:var(--card-2);border-radius:12px;padding:12px;margin-top:8px;}
.archive-plan-content{margin-top:8px;}
.archive-plan-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg);font-size:14px;}
.archive-plan-row:last-child{border-bottom:none;}
.archive-plan-row span{color:var(--label-3);}
.archive-plan-notes{font-size:13px;color:var(--label-2);padding:8px;background:var(--bg);border-radius:8px;margin-top:6px;line-height:1.5;}

/* ===== 本月汇总网格 ===== */
.month-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.month-stat-item{display:flex;flex-direction:column;align-items:center;padding:12px 8px;background:var(--bg);border-radius:10px;}
.month-stat-icon{font-size:24px;margin-bottom:4px;}
.month-stat-val{font-size:24px;font-weight:700;line-height:1.2;}
.month-stat-label{font-size:12px;color:var(--label-3);margin-top:2px;}

/* ===== 书架 ===== */
.book-card{padding:12px;}
.book-spine{width:36px;height:48px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.color-pick{transition:border .15s,transform .1s;}
.color-pick:active{transform:scale(.92);}

/* ===== 计时器 ===== */
#timerDisplay{font-variant-numeric:tabular-nums;letter-spacing:2px;}

/* ===== 月结金币卡片（渐变蓝） ===== */
.gold-coin-card{
  background:linear-gradient(135deg,#0A84FF,#5AC8FA);
  border:none;
  color:#fff;
}
.gold-coin-card .cmp-pair-row{border-bottom-color:rgba(255,255,255,.15);}

/* ===== 封印宝箱卡片（渐变紫金） ===== */
.treasure-chest-card{
  background:linear-gradient(135deg,#5E5CE6,#AF52DE);
  border:none;
  color:#fff;
}
</style>
</head>
<body>

<script>/* ===== Life Balance Studio · 核心逻辑 ===== */

// ===== 数据层 =====
const DB = {
  // 首页配置
  settings:{
    yearlyTarget: 100000,   // 年度存款目标
    rewardPool: 0,           // 奖励库
  },
  // 财务数据 - 按月存储 (起始月2026-07)
  finance:{
    '2026-07':{
      incomePlanned: 0,
      incomeActual: 0,
      hardExpenses:[],
      catMeta:{},
      goldOverride:null,
      expenses:[],
      reimbursements:[],
      plan:{}
    }
  },
  // 已存入金额(用于首页进度)
  savedTotal: 0,

  // 年度计划(按年存储)
  yearlyPlans: {},

  // 年度月结金币手动覆盖值
  yearGoldOverride:{},

  // 学习数据
  study:{
    monthlyGoal: 30,  // 本月学习目标打卡次数
    bigGoals:[],
    rewards:[],
    tasks:{},
    inspires:[],
    monthStats:{books:0,englishHours:0,inspires:0},
    taskCats:['英语','阅读','运动','技能','其他'],
    bookshelf:[],
    studySessions:[],
    timerActive:false,
    timerStart:null,
    timerCat:'',
  },

  // 家庭成员
  family:[],

  // 健康档案
  health:{},

  // 朋友圈
  social:[],

  // 事缓则圆 - 决策记录
  decisions:[],

  // 事缓则圆 - 小决策转盘记录
  smallDecisions:[],
  // 转盘比例配置(做/不做/再想想)
  wheelRatio:{do:1,dont:1,think:1},
  // 转盘自定义类型
  wheelCats:['餐饮外卖','购物冲动','娱乐消费','其他'],
};

// ===== 状态 =====
// ===== 数据持久化(localStorage) =====
const STORAGE_KEY = 'life_balance_studio_v1';
const BACKUP_KEY = 'life_balance_studio_backup';
const DB_VERSION = 'v2_clean';

function saveDB(){
  try {
    const dataToSave = JSON.stringify(DB);
    localStorage.setItem(STORAGE_KEY, dataToSave);
    // 自动备份:每次保存时存一份带时间戳的备份(最多保留3份)
    try {
      const ts = new Date().toISOString().slice(0,16).replace('T',' ');
      const backupEntry = { ts, data: dataToSave };
      let backups = [];
      try { backups = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]'); } catch(e2){}
      backups.unshift(backupEntry);
      if(backups.length > 3) backups = backups.slice(0,3);
      localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
    } catch(e2){ /* 备份失败不影响主流程 */ }
    localStorage.setItem('life_balance_db_version', DB_VERSION);
  } catch(e) {
    // localStorage 满了(可能 base64 太大),尝试不含 health.data 存
    try {
      const liteDB = JSON.parse(JSON.stringify(DB));

function importData(input){
  const file = input.files[0];
  if(!file){ return; }
  haptic();
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const imported = JSON.parse(e.target.result);
      if(!imported.settings || !imported.study){
        toast('文件格式不正确');
        return;
      }
      if(!confirm('导入将覆盖当前所有数据，确定继续？')) return;
      // 逐字段合并
      Object.keys(imported).forEach(key=>{
        if(key === 'study'){
          if(imported.study.bigGoals) DB.study.bigGoals = imported.study.bigGoals;
          if(imported.study.rewards) DB.study.rewards = imported.study.rewards;
          if(imported.study.taskCats) DB.study.taskCats = imported.study.taskCats;
          if(imported.study.monthStats) DB.study.monthStats = imported.study.monthStats;
          if(imported.study.tasks) DB.study.tasks = imported.study.tasks;
          if(imported.study.inspires) DB.study.inspires = imported.study.inspires;
          if(imported.study.bookshelf) DB.study.bookshelf = imported.study.bookshelf;
          if(imported.study.studySessions) DB.study.studySessions = imported.study.studySessions;
          if(imported.study.monthlyGoal) DB.study.monthlyGoal = imported.study.monthlyGoal;
        } else if(key === 'finance'){
          Object.keys(imported.finance||{}).forEach(mk=>{ DB.finance[mk] = imported.finance[mk]; });
        } else {
          DB[key] = imported[key];
        }
      });
      saveDB();
      closeSheet();
      switchModule('home');
      toast('数据导入成功！');
    } catch(err){
      toast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

function loadDB(){
  try {
    // 版本检测：旧数据直接清除
    const savedVersion = localStorage.getItem('life_balance_db_version');
    if(savedVersion !== DB_VERSION){
      localStorage.removeItem(STORAGE_KEY);
      localStorage.setItem('life_balance_db_version', DB_VERSION);
      return false;
    }
    const saved = localStorage.getItem(STORAGE_KEY);
    if(!saved) return false;
    const loaded = JSON.parse(saved);
    // 深合并:保留新字段,用已存数据覆盖
    Object.keys(loaded).forEach(key=>{
      if(key === 'finance'){
        Object.keys(loaded.finance||{}).forEach(mk=>{
          const m = loaded.finance[mk];
          // 数据迁移: hardExpense(数字) -> hardExpenses(数组)
          if(m.hardExpense !== undefined && m.hardExpenses === undefined){
            if(typeof m.hardExpense === 'number' && m.hardExpense > 0){
              m.hardExpenses = [{id:'h_'+mk,name:'硬性支出',amount:m.hardExpense,note:''}];
            } else {
              m.hardExpenses = [];
            }
            delete m.hardExpense;
          }
          if(m.hardExpenses === undefined) m.hardExpenses = [];
          if(m.catMeta === undefined) m.catMeta = {};
          if(m.goldOverride === undefined) m.goldOverride = null;
          if(m.reimbursements === undefined) m.reimbursements = [];
          if(m.expenses && Array.isArray(m.expenses)){
            m.expenses.forEach(e=>{ if(e.isAdvance === undefined) e.isAdvance = false; });
          }
          DB.finance[mk] = m;
        });
      } else if(key === 'study'){
        // 深合并 study:逐字段合并,保留默认值,只覆盖已存字段
        if(loaded.study.bigGoals) DB.study.bigGoals = loaded.study.bigGoals;
        if(loaded.study.rewards) DB.study.rewards = loaded.study.rewards;
        if(loaded.study.taskCats) DB.study.taskCats = loaded.study.taskCats;
        if(loaded.study.monthStats) DB.study.monthStats = loaded.study.monthStats;
        if(loaded.study.tasks) DB.study.tasks = loaded.study.tasks;
        if(loaded.study.inspires) DB.study.inspires = loaded.study.inspires;
        if(loaded.study.bookshelf) DB.study.bookshelf = loaded.study.bookshelf;
        if(loaded.study.studySessions) DB.study.studySessions = loaded.study.studySessions;
        if(loaded.study.timerActive !== undefined) DB.study.timerActive = loaded.study.timerActive;
        if(loaded.study.timerStart !== undefined) DB.study.timerStart = loaded.study.timerStart;
        if(loaded.study.timerCat) DB.study.timerCat = loaded.study.timerCat;
        if(loaded.study.monthlyGoal) DB.study.monthlyGoal = loaded.study.monthlyGoal;
      } else if(Array.isArray(loaded[key])){
        DB[key] = loaded[key];
      } else if(typeof loaded[key] === 'object' && loaded[key] !== null){
        DB[key] = Object.assign(DB[key]||{}, loaded[key]);
      } else {
        DB[key] = loaded[key];
      }
    });
    return true;
  } catch(e){
    console.error('加载失败:', e);
    return false;
  }
}

function calcMonthFinance(monthKey){
  const m = DB.finance[monthKey];
  if(!m) return {expenseTotal:0,hardTotal:0,balance:0,catSummary:{},reimbTotal:0,advanceTotal:0,advanceCount:0,goldPlanned:0,goldActual:0,goldOverride:null,hardExpenses:[],reimbursements:[],plan:{},catMeta:{}};
  const catSummary = {};
  const advanceCats = {};
  (m.expenses||[]).forEach(e=>{
    catSummary[e.cat] = (catSummary[e.cat]||0) + e.amount;
    if(e.isAdvance){
      advanceCats[e.cat] = (advanceCats[e.cat]||0) + e.amount;
    }
  });
  const monthExpense = Object.values(catSummary).reduce((a,b)=>a+b,0);
  const hardExpenses = m.hardExpenses||[];
  const hardTotal = hardExpenses.reduce((s,h)=>s+(h.amount||0),0);
  const reimbursements = m.reimbursements||[];
  const reimbTotal = reimbursements.reduce((s,r)=>s+(r.amount||0),0);
  const advanceTotal = Object.values(advanceCats).reduce((a,b)=>a+b,0);
  const advanceCount = (m.expenses||[]).filter(e=>e.isAdvance).length;
  const expenseTotal = monthExpense + hardTotal;
  const goldPlanned = (m.incomePlanned||0) - Object.values(m.plan||{}).reduce((a,b)=>a+b,0) - hardTotal;
  const goldActual = (m.incomeActual||0) - monthExpense - hardTotal + reimbTotal;
  const goldOverride = m.goldOverride;
  const goldFinal = goldOverride !== null ? goldOverride : goldActual;
  const balance = goldFinal;
  return {
    monthExpense, expenseTotal, balance, catSummary,
    incomePlanned:m.incomePlanned, incomeActual:m.incomeActual,
    hardExpenses, hardTotal,
    reimbursements, reimbTotal,
    advanceTotal, advanceCount, advanceCats,
    plan:m.plan, catMeta:m.catMeta||{},
    goldPlanned, goldActual, goldOverride, goldFinal
  };
}

function daysToBday(bd){
  const today = new Date();
  const [y,m,d] = bd.split('-').map(Number);

// ===== 年度存档分析 =====
function analyzeYearFinance(year){
  const yStr = String(year);
  const months = [];
  const catTotals = {};
  let totalIncome = 0, totalExpense = 0, totalGoldPlanned = 0, totalGoldActual = 0;
  let planAccuracySum = 0, planAccuracyCount = 0;

  for(let m=1;m<=12;m++){
    const mk = yStr + '-' + String(m).padStart(2,'0');
    const fin = DB.finance[mk];
    if(!fin) continue;
    const monthCats = {};
    (fin.expenses||[]).forEach(e=>{
      monthCats[e.cat] = (monthCats[e.cat]||0) + e.amount;
      catTotals[e.cat] = (catTotals[e.cat]||0) + e.amount;
    });
    const reimbursements = (fin.reimbursements||[]).reduce((s,r)=>s+(r.amount||0),0);
    const hardTotal = (fin.hardExpenses||[]).reduce((s,h)=>s+(h.amount||0),0);
    const monthExpense = Object.values(monthCats).reduce((a,b)=>a+b,0) + hardTotal;
    const monthIncome = (fin.incomeActual||0);
    const goldPlanned = (fin.incomePlanned||0) - Object.values(fin.plan||{}).reduce((a,b)=>a+b,0) - hardTotal;
    const goldActual = (fin.goldOverride !== null && fin.goldOverride !== undefined) ? fin.goldOverride : (monthIncome - monthExpense + reimbursements);

    totalIncome += monthIncome;
    totalExpense += monthExpense;
    totalGoldPlanned += goldPlanned;
    totalGoldActual += goldActual;

    // 计算预估精确度(收入预估偏差)
    if(fin.incomePlanned && fin.incomeActual){
      const dev = Math.abs(fin.incomeActual - fin.incomePlanned) / Math.max(fin.incomePlanned,1);
      planAccuracySum += (1 - Math.min(1, dev));
      planAccuracyCount++;
    }

    months.push({
      month: m,
      incomePlanned: fin.incomePlanned||0,
      incomeActual: monthIncome,
      goldPlanned, goldActual,
      expense: monthExpense,
      cats: monthCats
    });
  }

  const topCat = Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0] || ['无',0];
  const accuracy = planAccuracyCount > 0 ? Math.round(planAccuracySum / planAccuracyCount * 100) : 0;
  const catList = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const totalCatSpend = catList.reduce((s,[,v])=>s+v,0);

  return {
    months, totalIncome, totalExpense, totalGoldPlanned, totalGoldActual,
    topCat: topCat[0], topCatAmount: topCat[1],
    accuracy, catList, totalCatSpend,
    hasData: months.length > 0
  };
}

function analyzeYearStudy(year){
  const yStr = String(year);
  let totalTasks = 0, doneTasks = 0;
  const catStats = {};
  const monthStats = {};

  Object.keys(DB.study.tasks||{}).forEach(date=>{
    if(!date.startsWith(yStr)) return;
    const m = parseInt(date.slice(5,7));
    if(!monthStats[m]) monthStats[m] = {total:0, done:0};
    const tasks = DB.study.tasks[date]||[];
    tasks.forEach(t=>{
      totalTasks++;
      monthStats[m].total++;
      const cat = t.time || '其他';
      if(!catStats[cat]) catStats[cat] = {total:0, done:0};
      catStats[cat].total++;
      if(t.done){
        doneTasks++;
        monthStats[m].done++;
        catStats[cat].done++;
      }
    });
  });

  const monthlyGoal = DB.study.monthlyGoal || 30;
  const yearGoal = monthlyGoal * 12;
  const completionRate = totalTasks > 0 ? Math.round(doneTasks/totalTasks*100) : 0;
  const goalRate = yearGoal > 0 ? Math.round(doneTasks/yearGoal*100) : 0;

  // 找最佳和最差月份
  let bestMonth = null, worstMonth = null;
  Object.keys(monthStats).forEach(m=>{
    const ms = monthStats[m];
    if(ms.total === 0) return;
    const rate = ms.done / ms.total;
    if(!bestMonth || rate > bestMonth.rate) bestMonth = {month:m, rate, ...ms};
    if(!worstMonth || rate < worstMonth.rate) worstMonth = {month:m, rate, ...ms};
  });

  const catList = Object.entries(catStats).map(([cat,s])=>({cat, ...s, rate: s.total>0?Math.round(s.done/s.total*100):0})).sort((a,b)=>b.total-a.total);

  return {
    totalTasks, doneTasks, completionRate, goalRate, yearGoal,
    catList, monthStats, bestMonth, worstMonth,
    hasData: totalTasks > 0
  };
}

function saveYearPlan(year){
  haptic();
  const nextYear = String(year + 1);
  if(!DB.yearlyPlans) DB.yearlyPlans = {};
  DB.yearlyPlans[nextYear] = {
    incomeTarget: parseFloat(document.getElementById('ypIncome').value)||0,
    savingTarget: parseFloat(document.getElementById('ypSaving').value)||0,
    studyGoal: parseInt(document.getElementById('ypStudy').value)||0,
    focusCat: document.getElementById('ypFocusCat').value.trim(),
    notes: document.getElementById('ypNotes').value.trim(),
    autoGenerated: false
  };
  saveDB();
  closeSheet();
  renderHome(document.getElementById('content'));
  toast(nextYear + ' 年计划已保存');
}

function autoGeneratePlan(year){
  haptic();
  const nextYear = String(year + 1);
  const fin = analyzeYearFinance(year);
  const study = analyzeYearStudy(year);
  if(!DB.yearlyPlans) DB.yearlyPlans = {};

  const avgIncome = fin.hasData ? Math.round(fin.totalIncome / fin.months.length) : 12000;
  const avgSaving = fin.hasData ? Math.round(fin.totalGoldActual / fin.months.length) : 0;
  const suggestedStudyGoal = study.hasData ? Math.max(DB.study.monthlyGoal||30, Math.round(study.doneTasks/12)+5) : (DB.study.monthlyGoal||30);

  let notes = '';
  if(fin.hasData){
    notes += `基于${year}年数据：全年收入¥${fmtMoney(fin.totalIncome)}，支出¥${fmtMoney(fin.totalExpense)}。`;
    if(fin.topCat) notes += `消费最多的是「${fin.topCat}」(¥${fmtMoney(fin.topCatAmount)})，建议控制。`;
    notes += `预估精确度${fin.accuracy}%，`;
    notes += fin.accuracy >= 80 ? '预算把控良好，继续保持。' : '预算偏差较大，需提高预估准确性。';
  }
  if(study.hasData){
    notes += `学习完成率${study.completionRate}%，`;
    notes += study.goalRate >= 80 ? '执行情况良好。' : '需加强学习执行力。';
  }

  DB.yearlyPlans[nextYear] = {
    incomeTarget: avgIncome,
    savingTarget: avgSaving * 12,
    studyGoal: suggestedStudyGoal,
    focusCat: fin.hasData ? fin.topCat : '',
    notes: notes,
    autoGenerated: true
  };
  saveDB();
  renderHome(document.getElementById('content'));
  toast('已基于' + year + '年数据生成' + (year+1) + '年计划');
}

// 获取消费明细行(预估 vs 实际对比 + 迷你进度条)
function getExpenseRows(fin, monthData){
  const cats = [...new Set([
    ...Object.keys(fin.plan||{}),
    ...Object.keys(fin.catSummary)
  ])];
  if(!cats.length && !(monthData.expenses||[]).length) return '<div class="cmp-pair-empty">暂无消费明细</div>';
  const planTotal = Object.values(fin.plan||{}).reduce((a,b)=>a+b,0);
  return cats.map(cat=>{
    const planned = (fin.plan||{})[cat] || 0;
    const actual = fin.catSummary[cat] || 0;
    const diff = actual - planned;
    const isAdvance = (monthData.expenses||[]).some(e=>e.cat===cat && e.isAdvance);
    const pct = planned > 0 ? Math.min(100, Math.round(actual/planned*100)) : (actual>0?100:0);
    const barColor = diff > 0 ? '#FF9500' : (diff < 0 ? '#34C759' : '#007AFF');
    const diffStr = diff===0 ? '<span style="color:var(--label-3);font-size:11px;">刚好</span>' : (diff>0 ? '<span style="color:#FF9500;font-size:11px;">超¥'+fmtMoney(diff)+'</span>' : '<span style="color:#34C759;font-size:11px;">省¥'+fmtMoney(-diff)+'</span>');
    const notes = (monthData.expenses||[]).filter(e=>e.cat===cat && e.note);
    const notesHtml = notes.length ? '<div style="font-size:11px;color:var(--label-3);padding:2px 0 0;line-height:1.4;">' + notes.map(e=>'· '+e.note+(e.isAdvance?' ⚠️':'')).join('<br>') + '</div>' : '';
    const safeCat = cat.replace(/'/g,'').replace(/"/g,'');
    return `
      <div class="cmp-pair-row" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;align-items:center;">
          <span class="cmp-pair-name">${cat}${isAdvance?' <span style="color:#FF9500;font-size:10px;">⚠️</span>':''}</span>
          <span class="cmp-pair-col">¥ ${fmtMoney(planned)}</span>
          <span class="cmp-pair-col expense">¥ ${fmtMoney(actual)} ${diffStr}</span>
          <button class="cmp-pair-edit" onclick="editExpenseItem('${safeCat}')">✎</button>
        </div>
        <div style="background:#F2F2F7;height:3px;border-radius:2px;overflow:hidden;margin:2px 0;">
          <div style="background:${barColor};width:${pct}%;height:100%;border-radius:2px;"></div>
        </div>
        ${notesHtml}
      </div>
    `;
  }).join('');
}

function delHardExpense(id){

function saveHardExpenses(){
  haptic();
  const m = DB.finance[state.currentMonth];
  if(!m) return;
  m.hardExpenses.forEach((h,idx)=>{
    const nameEl = document.getElementById('hardName_'+idx);
    const amtEl = document.getElementById('hardAmount_'+idx);
    const noteEl = document.getElementById('hardNote_'+idx);
    if(nameEl) h.name = nameEl.value.trim() || '未命名';

function savePlan(){
  haptic();
  const m = DB.finance[state.currentMonth];
  if(!m || !m.plan) return;
  Object.keys(m.plan).forEach(c=>{
    const safeName = c.replace(/'/g,'').replace(/"/g,'');
    const el = document.getElementById('plan_'+safeName);
    if(el) m.plan[c] = parseFloat(el.value)||0;

function addPlanCat(){
  const name = document.getElementById('newPlanCat').value.trim();
  if(!name){ toast('请输入分类名称'); return; }
  haptic();
  const m = DB.finance[state.currentMonth];
  if(m.plan[name]!==undefined){ toast('该分类已存在'); return; }
  m.plan[name] = 0;

  renderPlanSheet(Object.keys(m.plan));
  toast('已添加分类');
}

function delPlanCat(name){
  haptic();
  const m = DB.finance[state.currentMonth];
  if(!m || !m.plan) return;
  const realName = Object.keys(m.plan).find(k=>k.replace(/'/g,'').replace(/"/g,'')===name) || name;
  if(m.plan[realName]===undefined){ toast('找不到该分类'); return; }
  delete m.plan[realName];

    m.expenses = m.expenses.filter(e=>e.cat!==realName);
  }
  saveDB();
  renderPlanSheet(Object.keys(m.plan));
  toast('已删除分类「'+realName+'」');
}


function openReport(){
  haptic();
  const fin = calcMonthFinance(state.currentMonth);
  const plan = fin.plan || {};
  let summaryParts = [];
  let html = `
    <div class="sheet-title">月度偏差报告 · ${state.currentMonth}</div>
    <div style="display:flex;gap:8px;font-size:12px;color:var(--label-3);margin-bottom:12px;">
      <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;background:#D1D1D6;border-radius:3px;"></span>预估(计划值)</span>
      <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;background:#007AFF;border-radius:3px;"></span>实际值</span>
    </div>
  `;

  // 各分类对比
  const cats = Object.keys({...plan, ...fin.catSummary});
  const maxVal = Math.max(...cats.map(c=>Math.max(plan[c]||0, fin.catSummary[c]||0)), 1);

  cats.forEach(cat=>{
    const planned = plan[cat]||0;
    const actual = fin.catSummary[cat]||0;
    const diff = actual - planned;
    const cls = diff>0 ? 'over' : (diff<0 ? 'under' : '');
    const sign = diff>0?'超支':'节省';
    const absDiff = Math.abs(diff);
    html += `
      <div class="bar-row">
        <div class="bar-row-label">${cat}</div>
        <div class="bar-pair">
          <div class="bar-col">
            <div class="bar-col-tag">预估 ¥${fmtMoney(planned)}</div>
            <div class="bar planned" style="width:${planned/maxVal*100}%"></div>
          </div>
          <div class="bar-col">
            <div class="bar-col-tag">实际 ¥${fmtMoney(actual)}</div>
            <div class="bar actual ${cls}" style="width:${actual/maxVal*100}%"></div>
          </div>
        </div>
        ${diff!==0?`<div class="bar-val" style="color:${diff>0?'var(--red)':'var(--green)'};">${sign} ¥${fmtMoney(absDiff)}</div>`:''}
      </div>
    `;
    if(diff!==0){
      summaryParts.push(`在"${cat}"上${sign} ${absDiff} 元`);
    }
  });

  // 总体对比
  const totalPlanned = Object.values(plan).reduce((a,b)=>a+b,0) + (fin.hardTotal||0);
  const totalActual = fin.expenseTotal;
  html += `
    <div class="bar-row" style="border-top:.5px solid var(--separator);padding-top:12px;">
      <div class="bar-row-label">总支出对比</div>
      <div class="bar-pair">
        <div class="bar-col">
          <div class="bar-col-tag">预估 ¥${fmtMoney(totalPlanned)}</div>
          <div class="bar planned" style="width:${totalPlanned/Math.max(totalPlanned,totalActual,1)*100}%"></div>
        </div>
        <div class="bar-col">
          <div class="bar-col-tag">实际 ¥${fmtMoney(totalActual)}</div>
          <div class="bar actual ${totalActual>totalPlanned?'over':'under'}" style="width:${totalActual/Math.max(totalPlanned,totalActual,1)*100}%"></div>
        </div>
      </div>
    </div>
  `;

  const summaryText = summaryParts.length
    ? `${state.currentMonth.split('-')[1]}月你${summaryParts.join('，')}。`
    : `${state.currentMonth.split('-')[1]}月各项支出均在预算内,表现稳定。`;

  html += `<div class="report-summary">📝 ${summaryText}</div>`;
  html += `<div class="sheet-actions"><button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">关闭</button></div>`;
  openSheet(html);
}

// ===== 本月汇总（动态计算）=====
function renderMonthSummary(){
  const now = new Date();
  const ym = now.toISOString().slice(0,7); // 2026-07
  // 本月新增灵感数
  const monthInspires = (DB.study.inspires||[]).filter(i=>{
    const d = i.date || '';
    // date 格式 "07-25" 或 "7月25日"
    const m = String(now.getMonth()+1).padStart(2,'0');
    return d.startsWith(m+'-') || d.startsWith(now.getMonth()+1+'月') || d.startsWith(m);
  }).length;
  // 也兼容旧数据（无日期过滤），用 inspires 总数
  const totalInspires = (DB.study.inspires||[]).length;

  // 本月学习时长（分钟）从 studySessions 统计
  let monthMinutes = 0;
  (DB.study.studySessions||[]).forEach(s=>{
    if(s.date && s.date.startsWith(ym)) monthMinutes += s.minutes||0;
  });
  const hours = (monthMinutes/60).toFixed(1);

  // 本月阅读量：书架中本月更新的页数变化
  let monthPages = 0;
  (DB.study.bookshelf||[]).forEach(b=>{
    // 如果有 monthRead 字段记录本月阅读页数
    if(b.monthRead && b.monthRead[ym]) monthPages += b.monthRead[ym];
  });
  // 本月完成的任务中分类为"阅读"的数量

// ===== 学习计时器 =====
function formatTimerDuration(ms){
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startStudyTimer(){
  haptic();
  DB.study.timerActive = true;
  DB.study.timerStart = Date.now();
  if(!DB.study.timerCat) DB.study.timerCat = '阅读';
  saveDB();
  renderStudy(document.getElementById('content'));
  // 启动计时器更新
  if(state.studyTimerInterval) clearInterval(state.studyTimerInterval);
  state.studyTimerInterval = setInterval(()=>{
    const disp = document.getElementById('timerDisplay');
    if(disp && DB.study.timerActive){
      disp.textContent = formatTimerDuration(Date.now() - DB.study.timerStart);
    }
  }, 1000);
}

function stopStudyTimer(){
  haptic();
  if(!DB.study.timerActive) return;
  const elapsed = Date.now() - DB.study.timerStart;
  const minutes = Math.round(elapsed/60000);
  if(minutes < 1){
    toast('学习时间不足1分钟，未记录');
  } else {
    const today = todayStr();
    if(!DB.study.studySessions) DB.study.studySessions = [];
    DB.study.studySessions.push({
      date: today,
      minutes: minutes,
      cat: DB.study.timerCat || '阅读',
      start: DB.study.timerStart,
      end: Date.now()
    });
    toast(`记录 ${minutes} 分钟 ${DB.study.timerCat||'学习'}`);
  }
  DB.study.timerActive = false;
  DB.study.timerStart = null;
  if(state.studyTimerInterval){ clearInterval(state.studyTimerInterval); state.studyTimerInterval = null; }
  saveDB();
  renderStudy(document.getElementById('content'));
}

  const b = (DB.study.bookshelf||[]).find(x=>x.id===id);

  b.currentPage = Math.max(0, Math.min(b.totalPages, b.currentPage + delta));
  if(b.currentPage !== oldPage){
    const ym = new Date().toISOString().slice(0,7);
    if(!b.monthRead) b.monthRead = {};
    b.monthRead[ym] = (b.monthRead[ym]||0) + (b.currentPage - oldPage);

  saveDB();
  renderStudy(document.getElementById('content'));
  if(b.currentPage >= b.totalPages){

function getWeekDates(){
  // 返回当前选中日期所在周的7天(周日到周六)
  const y = state.studyCalYear;
  const m = state.studyCalMonth;
  const day = state.studyCalDay;
  const cur = new Date(y, m-1, day);
  const dow = cur.getDay();
  const sunday = new Date(cur);
  sunday.setDate(cur.getDate() - dow);
  const dates = [];
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    dates.push(d);
  }
  return dates;
}

function getMonthDays(){
  // 返回当前选中月份的日历网格(42格=6周)
  const y = state.studyCalYear;
  const m = state.studyCalMonth;
  const first = new Date(y, m-1, 1);
  const startOffset = first.getDay();
  const start = new Date(first);
  start.setDate(first.getDate() - startOffset);
  const dates = [];
  for(let i=0;i<42;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    dates.push(d);
  }
  return dates;
}

function getDaysInMonth(y,m){

// 粒子特效
function burstParticles(taskId){
  const card = document.querySelector(`.task-card[data-id="${taskId}"]`);
  if(!card) return;
  const rect = card.querySelector('.task-circle').getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const colors=['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FFCC00'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=colors[i%colors.length];
    p.style.left=cx+'px';p.style.top=cy+'px';
    document.body.appendChild(p);
    const ang=(Math.PI*2*i)/14;
    const dist=60+Math.random()*40;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    p.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`,opacity:0}
    ],{duration:600+Math.random()*200,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}

      <div class="search-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8E8E93" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/></svg>

function renderHealthList(keyword){
  const kw = keyword.trim().toLowerCase();
  return Object.keys(DB.health).sort((a,b)=>b.localeCompare(a)).map(year=>{
    const allFiles = DB.health[year] || [];
    // assign uid to every file for stable deletion
    allFiles.forEach(f=>{ if(f.uid===undefined) f.uid = Date.now()+Math.random(); });
    const files = allFiles.filter(f=>
      !kw || f.name.toLowerCase().includes(kw) || f.tag.toLowerCase().includes(kw)
    );
    if(!files.length && kw) return '';
    const open = state.openFolders.has(year);
    return `
      <div class="health-folder ${open?'open':''}" data-year="${year}">
        <div class="health-folder-head" onclick="toggleFolder('${year}')">
          <span style="font-size:18px;">📁</span>
          <span>${year}年</span>
          <span style="color:var(--label-3);font-size:13px;font-weight:400;margin-left:auto;margin-right:8px;">${files.length} 项</span>
          <span class="health-folder-arrow">›</span>
        </div>
        <div class="health-folder-body">
          ${files.map((f)=>`
            <div class="health-file" style="display:flex;align-items:center;">
              <div class="health-file-icon">${f.type==='pdf'?'📄':'🖼️'}</div>
              <div class="health-file-info" style="flex:1;">
                <div class="health-file-name">${f.name}</div>
                <div class="health-file-tag">${f.tag} · ${f.date}</div>
              </div>
              ${f.checked?'<span class="health-file-check">✓</span>':''}
              <button class="cmp-pair-edit" style="flex-shrink:0;width:28px;height:28px;font-size:14px;background:#FFEBEE;color:var(--red);margin-left:8px;" onclick="event.stopPropagation();deleteHealthFile('${year}','${f.uid}')">🗑</button>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function deleteHealthFile(year, uid){
  haptic();
  if(!confirm('确定删除此档案?')) return;
  const files = DB.health[year];
  if(!files) return;
  const uidNum = Number(uid);
  const idx = files.findIndex(f=>Number(f.uid)===uidNum);
  if(idx<0){ toast('找不到档案'); return; }
  files.splice(idx,1);
  saveDB();
  renderHealth(document.getElementById('content'));
  toast('已删除档案');

let pendingFileData = null;
let pendingFileType = null;

function onFileSelected(input){
  const file = input.files[0];
  if(!file) return;
  haptic();
  const reader = new FileReader();
  reader.onload = function(e){
    pendingFileData = e.target.result;
    pendingFileType = file.type.startsWith('image/') ? 'img' : 'pdf';
    const sizeKB = Math.round(file.size/1024);
    const preview = document.getElementById('filePreview');
    if(pendingFileType==='img'){
      preview.innerHTML = '<img src="'+pendingFileData+'" style="max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;"><div style="margin-top:4px;">已选择: '+file.name+' ('+sizeKB+'KB)</div>';
    } else {
      preview.innerHTML = '<div style="padding:12px;background:var(--bg);border-radius:10px;margin-top:8px;">'+file.name+' ('+sizeKB+'KB) - PDF 已就绪</div>';
    }
    const nameInput = document.getElementById('newFileName');
    if(!nameInput.value) nameInput.value = file.name.replace(/\.[^.]+$/, '');
  };
  reader.readAsDataURL(file);
}

function confirmUpload(){
  const name=document.getElementById('newFileName').value.trim();
  const tag=document.getElementById('newFileTag').value.trim()||name;
  if(!name){ toast('请输入文件名'); return; }
  if(!pendingFileData){ toast('请先选择文件'); return; }
  haptic();

// ===== 事缓则圆板块 =====
// 4 种状态:悬案(冻结中) / 待办(已决待执行) / 已了(已执行完毕) / 死刑(确定放弃)
// 流转:录入→悬案(3天倒计时)→到期解锁→[执行→待办]或[放弃→死刑]
//       待办→(实际做完)→已了;待办→(中途反悔)→死刑

function countByStatus(status){
  return DB.decisions.filter(d=>d.status===status).length;
}

function fmtCountdown(endsStr){
  // 以 2026-07-27 00:00 为"现在"
  const now = new Date('2026-07-27T00:00:00');
  const ends = new Date(endsStr);
  const ms = ends - now;
  if(ms <= 0) return {text:'已到期', critical:false, pct:100, unlocked:true};
  const hours = Math.ceil(ms/3600000);
  const days = Math.floor(hours/24);
  const h = hours%24;
  const text = days>0 ? `${days}天 ${h}小时` : `${h}小时`;
  // 3天总时长=72小时,计算进度
  const totalMs = 72*3600000;
  const elapsed = totalMs - ms;
  const pct = Math.min(100, Math.round(elapsed/totalMs*100));
  return {text, critical: hours<=24, pct, unlocked:false};
}

function spinWheel(){
  const title = document.getElementById('wheelTitle').value.trim();
  if(!title){ toast('请输入决策事项'); return; }
  const amount = parseFloat(document.getElementById('wheelAmount').value)||0;
  haptic();
  const ratio = DB.wheelRatio || {do:1,dont:1,think:1};
  const total = ratio.do + ratio.dont + ratio.think;
  const r = Math.random() * total;
  let result;
  if(r < ratio.do) result = '做';
  else if(r < ratio.do + ratio.dont) result = '不做';
  else result = '再想想';
  const resultEl = document.getElementById('wheelResult');
  if(resultEl){
    let count = 0;
    const options = ['做','不做','再想想'];
    const colors = ['#34C759','#FF3B30','#FF9500'];
    const interval = setInterval(()=>{
      const idx = count % 3;
      resultEl.textContent = options[idx];
      resultEl.style.color = colors[idx];
      count++;
      if(count > 15){
        clearInterval(interval);
        resultEl.textContent = result;
        const finalColor = result==='做'?'#34C759':(result==='不做'?'#FF3B30':'#FF9500');
        resultEl.style.color = finalColor;
        resultEl.style.transform = 'scale(1.3)';
        resultEl.style.transition = 'transform 0.3s';
        setTimeout(()=>{ resultEl.style.transform = 'scale(1)'; }, 300);
        if(!DB.smallDecisions) DB.smallDecisions = [];
        DB.smallDecisions.push({
          id:'sd'+Date.now(),
          title, amount, result,
          category: selectedWheelCat,
          timestamp: new Date().toISOString()
        });
        saveDB();
        toast('转盘结果: '+result);
      }
    }, 80);
  }
}

  haptic();
  state.decisionTab = t;
  document.getElementById('decList').innerHTML = renderDecList();
  // 更新 Tab 高亮
  document.querySelectorAll('.dec-tab').forEach((el,i)=>{
    const tabs=['待办','悬案','历史'];
    el.classList.toggle('active', tabs[i]===t);
  });
}

function renderDecList(){
  const tab = state.decisionTab;
  let list;
  if(tab==='悬案') list = DB.decisions.filter(d=>d.status==='悬案');
  else if(tab==='待办') list = DB.decisions.filter(d=>d.status==='待办');
  else list = DB.decisions.filter(d=>d.status==='已了'||d.status==='死刑').sort((a,b)=>(b.decision_date||'').localeCompare(a.decision_date||''));

  if(!list.length){
    const msg = tab==='悬案'?'没有悬案,清净得很':tab==='待办'?'待办池空空如也':'暂无历史记录';
    return `<div class="empty-state"><div class="empty-state-icon">🧘</div><div class="empty-state-text">${msg}</div></div>`;
  }

  return list.map(d=>{
    if(d.is_comparison) return renderCmpCard(d);
    return renderSimpleCard(d);
  }).join('');
}

function renderSimpleCard(d){
  const isDead = d.status==='死刑';
  const isDone = d.status==='已了';
  const isTodo = d.status==='待办';
  const isCool = d.status==='悬案';

  let cd = null;
  if(isCool){ cd = fmtCountdown(d.cooldownEnds); }
  const unlocked = cd && cd.unlocked;

  let badge = '';
  if(isCool) badge = '<span class="dec-badge cooling">🤔 悬案</span>';
  if(isTodo) badge = '<span class="dec-badge todo">⏳ 待办</span>';
  if(isDone) badge = '<span class="dec-badge done">✅ 已了</span>';
  if(isDead) badge = '<span class="dec-badge dead">🪦 死刑</span>';

  let circle = '';
  if(isTodo) circle = '<div class="dec-circle-out" onclick="event.stopPropagation()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  else if(isCool) circle = '<div style="width:30px;height:30px;border-radius:50%;background:#FFF3E0;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🧊</div>';
  else if(isDone) circle = '<div class="dec-circle-out done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  else if(isDead) circle = '<div style="width:30px;height:30px;border-radius:50%;background:#FFEBEE;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🪦</div>';

  let actions = '';
  if(isCool && unlocked){
    actions = '<div class="dec-actions">'+
      '<button class="dec-btn dec-btn-exec" onclick="execDecision(\''+d.id+'\')">✅ 执行</button>'+
      '<button class="dec-btn dec-btn-drop" onclick="killDecision(\''+d.id+'\')">❌ 放弃</button>'+
      '<button class="dec-btn dec-btn-ghost" onclick="deleteDecision(\''+d.id+'\')">🗑 删除</button>'+
    '</div>';
  } else if(isTodo){
    actions = '<div class="dec-actions">'+
      '<button class="dec-btn dec-btn-done" onclick="completeDecision(\''+d.id+'\')">✅ 办完了</button>'+
      '<button class="dec-btn dec-btn-kill" onclick="killDecision(\''+d.id+'\')">🗑️ 不办了</button>'+
      '<button class="dec-btn dec-btn-ghost" onclick="deleteDecision(\''+d.id+'\')">🗑 删除</button>'+
    '</div>';
  }

  let amountStr = d.amount>0 ? '¥'+fmtMoney(d.amount) : '';
  let deadMark = isDead ? '<div class="dead-mark">☠️ 已弃 · '+d.decision_date+'</div>' : '';
  let doneMark = isDone ? '<div style="font-size:12px;color:var(--green);margin-top:6px;">✅ 完成于 '+d.decision_date+'</div>' : '';
  // 历史(已了/死刑)状态显示删除按钮
  if(isDone || isDead){
    actions = '<div class="dec-actions"><button class="dec-btn dec-btn-ghost" onclick="deleteDecision(\''+d.id+'\')">🗑 删除</button></div>';
  }

  return `
    <div class="dec-card ${isDead?'dead':''}" data-id="${d.id}">
      <div class="dec-row">
        ${circle}
        <div class="dec-body">
          <div>${badge}${d.title}</div>
          <div class="dec-sub">${d.note}${amountStr?' · '+amountStr:''}</div>
          ${isCool ? '<div class="dec-countdown '+(cd.critical?'critical':'')+'">⏱️ 倒计时 '+cd.text+'</div><div class="dec-cool-bar"><span style="width:'+cd.pct+'%"></span></div>'+(unlocked?'<div style="font-size:12px;color:var(--green);margin-top:4px;font-weight:600;">🔓 已冷却完毕,可执行</div>':'<div style="font-size:11px;color:var(--label-3);margin-top:3px;">冷静期内不可操作</div>') : ''}
        </div>
      </div>
      ${actions}
      ${doneMark}
      ${deadMark}
      ${(isCool && !unlocked) ? '<div class="dec-actions"><button class="dec-btn dec-btn-ghost" onclick="deleteDecision(\''+d.id+'\')">🗑 删除</button></div>' : ''}
    </div>
  `;
}

function renderCmpCard(d){
  const isDead = d.status==='死刑';
  const isDone = d.status==='已了';
  const isCool = d.status==='悬案';
  const isTodo = d.status==='待办';
  const cd = isCool ? fmtCountdown(d.cooldownEnds) : null;
  const unlocked = cd && cd.unlocked;
  // 活跃状态(待办/悬案已解锁/死刑)默认展开,方便直接追加选项
  const expanded = state.expandedCmp.has(d.id) || isTodo || (isCool && unlocked) || isDead;
  const liveOpts = d.options.filter(o=>!o.dead);
  const winner = d.winner_id ? d.options.find(o=>o.id===d.winner_id) : null;

  let badge = '';
  if(isCool) badge = '<span class="dec-badge cooling">🤔 悬案</span>';
  if(isTodo) badge = '<span class="dec-badge todo">⏳ 待办</span>';
  if(isDone) badge = '<span class="dec-badge done">✅ 已决</span>';
  if(isDead) badge = '<span class="dec-badge dead">🪦 死刑</span>';

  let cmpActions = '';
  if(isCool && unlocked){
    cmpActions = '<div class="dec-actions">'+
      '<button class="dec-btn dec-btn-drop" onclick="killDecision(\''+d.id+'\')">❌ 放弃全部</button>'+
    '</div>';
  } else if(isTodo){
    cmpActions = '<div class="dec-actions">'+
      '<button class="dec-btn dec-btn-kill" onclick="killDecision(\''+d.id+'\')">🗑️ 放弃全部</button>'+
    '</div>';
  }

  let winnerTag = winner ? '<span class="cmp-winner-tag">🏆 赢家:'+winner.name+'</span>' : '';
  let deadMark = isDead ? '<div class="dead-mark">☠️ 已弃 · '+d.decision_date+'</div>' : '';

  return `
    <div class="cmp-card ${isDead?'dead':''} ${expanded?'open':''}" data-id="${d.id}">
      <div class="cmp-head" onclick="toggleCmp('${d.id}')">
        <span class="cmp-icon">🔁</span>
        <div class="cmp-title">${badge}${winnerTag}【比选】${d.title}</div>
        <span class="cmp-count">${liveOpts.length}个选项</span>
        <span class="cmp-arrow">›</span>
      </div>
      <div class="cmp-body">
        ${isCool && !unlocked ? '<div style="font-size:12px;color:var(--orange);margin-bottom:8px;">⏱️ 冷静倒计时 '+cd.text+' · 暂不可裁决</div>':''}
        ${isCool && unlocked ? '<div style="font-size:12px;color:var(--green);margin-bottom:8px;font-weight:600;">🔓 已冷却,可左滑设赢家</div>':''}
        ${d.options.map(o=>`
          <div class="cmp-opt" ${o.dead?'style="opacity:.5;"':''}>
            <div class="cmp-opt-info">
              <div class="cmp-opt-name">${o.name}${o.id===d.winner_id?' 🏆':''}</div>
              <div class="cmp-opt-meta">${o.note} · ¥${fmtMoney(o.price)}</div>
            </div>
            ${o.dead ? '<span style="font-size:12px;color:var(--red);">已弃</span>' :
              (isCool && unlocked) || isTodo ?
              '<div class="cmp-opt-actions">'+
                '<button class="cmp-opt-btn cmp-opt-win" onclick="setWinner(\''+d.id+'\',\''+o.id+'\')">设为赢家</button>'+
                '<button class="cmp-opt-btn cmp-opt-kill" onclick="killOption(\''+d.id+'\',\''+o.id+'\')">弃</button>'+
              '</div>' : ''}
          </div>
        `).join('')}
        ${(!isCool||unlocked) && !isDead && !isDone ?
          '<div class="cmp-add-row">'+
            '<input class="sheet-input" id="newOpt_'+d.id+'" placeholder="追加选项名称" style="height:44px;padding:0 12px;">'+
            '<input class="sheet-input" id="newOptPrice_'+d.id+'" type="number" placeholder="价格" style="width:80px;height:44px;padding:0 8px;">'+
            '<button class="cmp-add-btn" onclick="addCmpOption(\''+d.id+'\')">＋</button>'+
          '</div>' : ''}
        ${deadMark}
      </div>
      ${cmpActions}
    </div>
  `;
}

function toggleCmp(id){
  haptic();
  if(state.expandedCmp.has(id)) state.expandedCmp.delete(id);
  else state.expandedCmp.add(id);
  document.getElementById('decList').innerHTML = renderDecList();
}

// 悬案→待办(执行)
function execDecision(id){
  haptic();
  const d = DB.decisions.find(x=>x.id===id);
  if(!d) return;
  d.status='待办';
  d.decision_date = todayStr();
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  saveDB();
  toast('已加入待办池');
}

// 待办→已了(确认完成)
function completeDecision(id){
  haptic();
  const d = DB.decisions.find(x=>x.id===id);
  if(!d) return;
  d.status='已了';
  d.decision_date = todayStr();
  strongHaptic();
  burstParticlesById('dec-card-'+id);
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  saveDB();
  toast('✅ 已完成,干得漂亮');
}

// 任意→死刑(放弃)
function killDecision(id){
  haptic();
  const d = DB.decisions.find(x=>x.id===id);
  if(!d) return;
  d.status='死刑';
  d.decision_date = todayStr();
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  saveDB();
  toast('已移入死刑区');
}

// 彻底删除决策记录
function deleteDecision(id){
  haptic();
  const idx = DB.decisions.findIndex(x=>x.id===id);
  if(idx<0) return;
  DB.decisions.splice(idx,1);
  saveDB();
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  toast('已删除');
}

// 比选项:设为赢家 → 剥离生成独立待办,原组标记已决
function setWinner(groupId, optId){
  haptic();
  const g = DB.decisions.find(x=>x.id===groupId);
  if(!g) return;
  const opt = g.options.find(o=>o.id===optId);
  if(!opt) return;
  g.winner_id = optId;
  g.status='已了';
  g.decision_date=todayStr();
  // 复制子选项信息生成新的待办事项
  const newRec = {
    id:'d'+Date.now(),
    title: opt.name,
    amount: opt.price,
    note: '来自比选组「'+g.title+'」的赢家'+(opt.note?' · '+opt.note:''),
    status:'待办',
    created_at:new Date().toISOString(),
    cooldownEnds:new Date(Date.now()+72*3600000).toISOString(),
    is_comparison:false,
    parent_group_id:groupId,
    decision_date:'2026-07-27',
  };
  DB.decisions.push(newRec);
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  saveDB();
  toast('🏆 赢家已选,已生成待办');
}

// 比选项:单个放弃
function killOption(groupId, optId){
  haptic();
  const g = DB.decisions.find(x=>x.id===groupId);
  if(!g) return;
  const opt = g.options.find(o=>o.id===optId);
  if(opt) opt.dead = true;
  // 如果全部选项都死了,整个组进入死刑
  if(g.options.every(o=>o.dead)){
    g.status='死刑';
    g.decision_date=todayStr();
    toast('全部选项已弃,比选组进入死刑');
  } else {
    toast('已放弃该选项');
  }
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  saveDB();
}

// 比选组:追加选项
function addCmpOption(groupId){
  const nameEl = document.getElementById('newOpt_'+groupId);
  const priceEl = document.getElementById('newOptPrice_'+groupId);
  const name = nameEl.value.trim();
  const price = parseFloat(priceEl.value)||0;
  if(!name){ toast('请输入选项名称'); return; }
  haptic();
  const g = DB.decisions.find(x=>x.id===groupId);
  if(!g){ toast('记录不存在'); return; }
  g.options.push({id:'o'+Date.now(), name, price, note:'新增选项', dead:false});
  // 保持展开状态
  state.expandedCmp.add(groupId);
  document.getElementById('decList').innerHTML = renderDecList();
  emitDecisions();
  saveDB();
  toast('已追加选项');
}

// 粒子特效(用于待办完成)
function burstParticlesById(prefix){
  // 通用粒子,从屏幕中心喷射
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const colors=['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FFCC00'];
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=colors[i%colors.length];
    p.style.left=cx+'px';p.style.top=cy+'px';
    document.body.appendChild(p);
    const ang=(Math.PI*2*i)/14;
    const dist=60+Math.random()*40;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-20;
    p.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:1},
      {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`,opacity:0}
    ],{duration:600+Math.random()*200,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}

      <div class="sheet-label">图标(emoji)</div>
      <input class="sheet-input" id="rwIcon" value="${r.icon||'🎁'}">
    </div>
    <div class="sheet-field">
      <div class="sheet-label">解锁条件</div>
      <input class="sheet-input" id="rwCondition" value="${r.condition}">
    </div>
    <div class="sheet-field">
      <div class="sheet-label">是否已解锁</div>
      <div class="cat-select">
        <div class="cat-opt ${!r.unlocked?'selected':''}" onclick="this.parentElement.querySelectorAll('.cat-opt').forEach(o=>o.classList.remove('selected'));this.classList.add('selected');document.getElementById('rwUnlocked').value='0';">未解锁</div>
        <div class="cat-opt ${r.unlocked?'selected':''}" onclick="this.parentElement.querySelectorAll('.cat-opt').forEach(o=>o.classList.remove('selected'));this.classList.add('selected');document.getElementById('rwUnlocked').value='1';">已解锁</div>
      </div>
      <input type="hidden" id="rwUnlocked" value="${r.unlocked?'1':'0'}">
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">取消</button>
      <button class="sheet-btn sheet-btn-primary" onclick="saveRewardEdit('${id}')">保存</button>
    </div>
  `);
}

function saveRewardEdit(id){
  const title = document.getElementById('rwTitle').value.trim();
  if(!title){ toast('请输入奖励名称'); return; }
  haptic();
  const r = (DB.study.rewards||[]).find(x=>x.id===id);
  if(!r) return;
  r.title = title;
  r.icon = document.getElementById('rwIcon').value.trim() || '🎁';
  r.condition = document.getElementById('rwCondition').value.trim() || '未设置';
  r.unlocked = document.getElementById('rwUnlocked').value === '1';
  saveDB();
  closeSheet();
  openRewardLibrary();
  toast('奖励已更新');
}

function deleteReward(id){
  haptic();
  if(!confirm('确定删除此奖励?')) return;
  DB.study.rewards = (DB.study.rewards||[]).filter(r=>r.id!==id);
  saveDB();
  openRewardLibrary();
  toast('已删除');
}

let expenseCat='饮食吃喝';
function openExpenseSheet(){
  expenseCat='饮食吃喝';
  openSheet(`
    <div class="sheet-title">记一笔支出</div>
    <div class="numpad-display" id="amountDisplay">¥ 0</div>
    <div class="sheet-field">
      <div class="sheet-label">选择分类</div>
      <div class="cat-select" id="expCatSelect">
        ${['衣服服饰','饮食吃喝','购物买买买','硬性支出','其他'].map(c=>`<div class="cat-opt ${c===expenseCat?'selected':''}" onclick="selectExpCat(this,'${c}')">${c}</div>`).join('')}
      </div>
    </div>
    <div class="sheet-field">
      <div class="sheet-label">备注(可选)</div>
      <input class="sheet-input" id="expNote" placeholder="如:聚餐">
    </div>
    <div class="numpad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="numpad-key" onclick="inputNum('${n}')">${n}</button>`).join('')}
      <button class="numpad-key" onclick="inputNum('.')">.</button>
      <button class="numpad-key" onclick="inputNum('0')">0</button>
      <button class="numpad-key" onclick="delNum()" style="font-size:18px;">⌫</button>
    </div>
    <div class="sheet-actions">
      <button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">取消</button>
      <button class="sheet-btn sheet-btn-primary" onclick="confirmExpense()">确认记录</button>
    </div>
  `);
}

let expenseAmount='';
function inputNum(n){
  haptic();
  let v=expenseAmount+n;
  if(v.split('.').length>2) return;
  expenseAmount=v;
  updateAmountDisplay();
}
function delNum(){
  haptic();
  expenseAmount=expenseAmount.slice(0,-1);
  updateAmountDisplay();
}
function updateAmountDisplay(){
  const v=parseFloat(expenseAmount||'0');
  document.getElementById('amountDisplay').textContent='¥ '+fmtMoney(v);
}
function selectExpCat(el,cat){
  haptic();
  document.querySelectorAll('#expCatSelect .cat-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  expenseCat=cat;
}

function confirmExpense(){
  const amount=parseFloat(expenseAmount||'0');
  if(!amount){ toast('请输入金额'); return; }
  const note=document.getElementById('expNote').value.trim();
  haptic();

  const month = state.currentMonth;
  if(!DB.finance[month]) DB.finance[month]={incomePlanned:12000,incomeActual:12000,hardExpenses:[],catMeta:{},goldOverride:null,expenses:[],reimbursements:[],plan:{'衣服服饰':600,'饮食吃喝':1500,'购物买买买':1000}};

  const isHard = expenseCat==='硬性支出';
  if(isHard){
    if(!DB.finance[month].hardExpenses) DB.finance[month].hardExpenses=[]; DB.finance[month].hardExpenses.push({id:'h'+Date.now(),name:'硬性支出',amount:amount,note:''});
  }else{
    DB.finance[month].expenses.push({id:'e'+Date.now(),cat:expenseCat,amount,date:'07-27',note});
  }

  // 结余自动归入存款
  const fin = calcMonthFinance(month);
  const newBalance = fin.balance;
  // 更新已存总额:原值 + 本月结余变化(简化:直接加上本次结余影响)
  // 这里简化处理:每次记账后,若结余为正,差额流入存款
  // 实际应用中应做增量,这里保持总额联动
  DB.savedTotal = DB.savedTotal; // 存款总额由各月结余累计,此处保持不变(避免重复累加)
  // 重新计算 savedTotal = 历史各月结余之和 + 初始值
  recalcSaved();
  saveDB();

  closeSheet();
  expenseAmount='';
  emitSaved();
  toast('已记录 ¥'+fmtMoney(amount));
  if(state.currentModule==='money') renderMoney(document.getElementById('content'));
}

function recalcSaved(){

document.getElementById('fabCheckin').onclick=()=>{
  haptic();
  switchModule('study');
};

// ===== 设置 =====
document.getElementById('settingsBtn').onclick=()=>{
  haptic();
  openSheet(`
    <div class="sheet-title">设置</div>
    <div class="sheet-field">
      <div class="sheet-label">年度存款总额目标</div>
      <input class="sheet-input" id="setTarget" type="number" value="${DB.settings.yearlyTarget}">
    </div>
    <div class="sheet-field">
      <div class="sheet-label">奖励库(元)</div>
      <input class="sheet-input" id="setReward" type="number" value="${DB.settings.rewardPool}">
    </div>
    <div class="sheet-field">
      <div class="sheet-label">当前已存</div>
      <input class="sheet-input" id="setSaved" type="number" value="${DB.savedTotal}">
    </div>

    <div class="sheet-field" style="border-top:1px solid var(--bg);padding-top:12px;">
      <button class="sheet-btn sheet-btn-secondary" style="width:100%;background:var(--bg);color:var(--blue);" onclick="openDataManager()">💾 数据管理（备份/恢复）</button>
    </div>

    <div class="sheet-actions">
      <button class="sheet-btn sheet-btn-secondary" onclick="closeSheet()">取消</button>
      <button class="sheet-btn sheet-btn-primary" onclick="saveSettings()">保存</button>
    </div>
  `);
};

function saveSettings(){
  haptic();
  DB.settings.yearlyTarget = parseFloat(document.getElementById('setTarget').value)||DB.settings.yearlyTarget;
  DB.settings.rewardPool = parseFloat(document.getElementById('setReward').value)||0;
  DB.savedTotal = parseFloat(document.getElementById('setSaved').value)||0;
  closeSheet();
  emitSaved();
  saveDB();
  toast('设置已保存');
}

// ===== 内容滚动监听 =====
document.getElementById('content').addEventListener('scroll',function(){
  document.getElementById('topbar').classList.toggle('scrolled', this.scrollTop>2);
});

// ===== 边缘滑动切换月份(财务板块) =====
let touchStartX=0, touchStartY=0;
document.getElementById('content').addEventListener('touchstart',e=>{
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
},{passive:true});

document.getElementById('content').addEventListener('touchend',e=>{
  if(state.currentModule!=='money') return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*2){
    // 仅在屏幕边缘20%区域内触发
    const w=window.innerWidth;
    if(touchStartX < w*0.2 || touchStartX > w*0.8){
      changeMonth(dx>0?-1:1);
    }
  }
},{passive:true});

loadDB();
// 初始化
switchModule('home');
